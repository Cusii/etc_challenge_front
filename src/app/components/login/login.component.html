<mat-card appearance="outlined">
  <h1>Iniciar sesión</h1>
  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <mat-form-field class="example-full-width">
        <mat-label>User Name</mat-label>
        <input type="text" formControlName="userName" matInput required placeholder="Username">
        <mat-error *ngIf="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched">
          Se requiere nombre de usuario.
        </mat-error>
      </mat-form-field>

      <mat-form-field class="example-full-width" appearance="fill">
        <mat-label>Password</mat-label>
        <input [type]="hide ? 'password' : 'text'" formControlName="password" matInput required placeholder="Password">
        <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Se requiere contraseña.
        </mat-error>
      </mat-form-field>

      <button type="submit" [disabled]="loginForm.invalid">Login</button>
      <button mat-flat-button type="button" (click)="goToRegister()">Go to Register</button>
    </form>
  </mat-card-content>
</mat-card>
